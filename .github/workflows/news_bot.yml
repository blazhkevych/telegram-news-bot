name: News Bot

on:
  # ГРАФІК КАНАЛУ ТРИМАЄ НЕ ЦЕЙ CRON, а зовнішній пінгер (EXTERNAL_TRIGGER.md),
  # який б'є workflow_dispatch рівно кожні 15 хв. Заміряно за добу 09–10.08:
  # із 123 прогонів 96 прийшли від пінгера і лише 27 — звідси. Тобто '*/15'
  # тут виконувався на 28% і врозбіг (09:22, 10:04, 10:51…) — GitHub чесно
  # попереджає, що scheduled-прогони відкидаються під навантаженням.
  #
  # ЧОМУ CRON ВСЕ Ж ЛИШАЄТЬСЯ, хоч і дублює пінгер: це ЄДИНЕ, що працює, коли
  # пінгер помре. Без нього зупинка зовнішнього сервісу = тиша в каналі без
  # жодного сигналу. Саме ці прогони дають watch_schedule() у scheduler.py
  # пульс, з якого він помітить розрив і напише адміну. Прибрати cron —
  # прибрати єдиний спосіб дізнатися, що канал зупинився.
  #
  # Раз на годину, а не кожні 15 хв, і НЕ о :00 — зайвих прогонів більше не
  # треба (розклад не наш), а зсув від початку години помітно піднімає шанс,
  # що GitHub цей прогін узагалі виконає.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # `models: read` прибрано (БАГ-016): GitHub Models закрито 30.07.2026,
  # дозвіл більше нічим не керує.

# Не запускати два прогони одночасно (щоб не було конфліктів git push)
concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # ref: main — брати АКТУАЛЬНУ вершину гілки на момент виконання.
          # Без цього GitHub пришпилює SHA на момент СТВОРЕННЯ прогону: якщо
          # прогін чекав у черзі concurrency, він стартував зі старої БД і
          # ловив конфлікт published.db на push (втрата стану → дублі).
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # Необов'язковий: публічний username каналу для посилань у дайджесті.
          # Дозволяє тримати TELEGRAM_CHANNEL_ID числовим (-100…), щоб зміна
          # публічного посилання каналу більше не могла зупинити публікацію.
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # CEREBRAS_API_KEY прибрано (БАГ-017, 05.09.2026): з 21.07.2026
          # безкоштовного тарифу немає, кожен виклик — 402 «Payment required».
          # MISTRAL_API_KEY прибрано (ревізія 17.08.2026): провайдер віддавав
          # 402 «Check your subscription» на кожному виклику ≈ 660 марних
          # запитів на добу. Безкоштовного плану для цієї моделі більше немає.
          # SambaNova Cloud — 200 тис. токенів/добу на КОЖНУ модель, без
          # картки (docs.sambanova.ai → rate limits). Секрет ще не заведено:
          # ключ береться на cloud.sambanova.ai, без нього нога просто неактивна.
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          # Cloudflare Workers AI — 10 тис. «нейронів»/добу ≈ 130 відповідей
          # gpt-oss-120b (стара оцінка «1 300» була завищена вдесятеро, див.
          # LLM_PROVIDERS у bot.py), без картки. Потрібні ОБИДВА секрети, інакше
          # провайдер сам себе вимикає (URL збирається з account_id). Станом
          # на 05.09.2026 обидва секрети порожні — нога не працює.
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FEEDBACK_BOT_TOKEN: ${{ secrets.FEEDBACK_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python scheduler.py

      - name: Run feedback bot
        env:
          FEEDBACK_BOT_TOKEN: ${{ secrets.FEEDBACK_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python feedback_bot.py

      - name: Run Twitter bot
        if: false   # ЗАМОРОЖЕНО: X скасував безкоштовний API (тепер pay-per-use,
                    # ~$0.20/твіт з посиланням). Див. BUGS.md БАГ-007 / issue #2.
                    # Код готовий; повернути — коли проект зароблятиме або на Bluesky.
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python twitter_bot.py

      - name: Save database
        run: |
          git config user.name  "News Bot"
          git config user.email "bot@users.noreply.github.com"
          git add published.db feedback_offset.txt twitter.db || true
          if git diff --staged --quiet; then
            echo "БД без змін — нічого зберігати."
            exit 0
          fi
          git commit -m "update db [skip ci]"
          # ВАЖЛИВО: без pull --rebase push падає non-fast-forward щоразу, коли
          # в main з'явився чужий коміт (напр. правка коду) — і СТАН ВТРАЧАЄТЬСЯ.
          # Наступний прогін стартує зі старої БД: не знає про опубліковане
          # (→ дублі в каналі) і про SKIP (→ повторні виклики LLM → 429).
          # Саме так 15.07 бот три години не зберігав БД. Тому — retry з rebase.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "✅ БД збережено (спроба $i)"
              exit 0
            fi
            # Конфлікт бінарної БД (хтось запушив свою published.db, поки ми
            # працювали): у rebase «theirs» = НАШ коміт — лишаємо нашу БД
            # (у ній пости ЦЬОГО прогону) і завершуємо rebase. Якщо не
            # вийшло — скидаємо недобитий rebase, інакше наступна спроба
            # падає з «unmerged files» (саме так згорів прогін 16.07 15:47).
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git checkout --theirs published.db twitter.db feedback_offset.txt 2>/dev/null || true
              git add published.db twitter.db feedback_offset.txt 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            echo "⚠️ спроба $i не вдалась — повтор"
            sleep 5
          done
          echo "❌ НЕ вдалося зберегти БД — стан втрачено, наступний прогін дублюватиме"
          exit 1
